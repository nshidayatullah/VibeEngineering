# VibePlan: situs statis di vibeplan.emha.web.id
# Pasang: sudo cp deploy/nginx-vibeplan.conf /etc/nginx/sites-available/vibeplan
#         sudo ln -s /etc/nginx/sites-available/vibeplan /etc/nginx/sites-enabled/vibeplan
#         sudo nginx -t && sudo systemctl reload nginx
# HTTPS:  sudo certbot --nginx -d vibeplan.emha.web.id  (certbot menambah blok listen 443 sendiri)

# Rate limit untuk /api/ai/ (klarifikasi AI). Baris ini harus di luar blok server.
limit_req_zone $binary_remote_addr zone=vibeplan_ai:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vibeplan.emha.web.id;

    root /var/www/vibeplan;
    index index.html;

    # Header keamanan. Aplikasi hanya memanggil /api/ai/ di origin yang sama, jadi semua sumber dibatasi ke 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # File di assets/ diberi hash oleh Vite, aman di-cache selamanya.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html selalu diambil ulang agar versi baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Cek ketersediaan AI: dipanggil sekali per muat halaman, sengaja tanpa limit_req agar tombol
    # klarifikasi tidak hilang hanya karena kuota /clarify habis. Murah: tidak memanggil 9router.
    location = /api/ai/health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Klarifikasi AI: diteruskan ke service vibeplan-ai (systemd) yang memanggil 9router.
    # API key 9router hanya ada di /etc/vibeplan-ai.env, tidak pernah dikirim ke browser.
    location /api/ai/ {
        limit_req zone=vibeplan_ai burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 100s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
